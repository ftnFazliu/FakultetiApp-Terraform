name: Terraform

# plan  -> kur hapet një pull request (tregon çfarë do të ndryshonte, si koment në PR)
# apply -> kur bashkohet (merge) në main (ndryshon me të vërtetë Azure)
#
# Dosja që përdoret: variabla e GitHub "TF_DIR" (Settings > Secrets and variables > Actions > Variables).
# Pa të, përdoret hapi-6-state. Për hapin e avancuar vendosni TF_DIR = hapi-7-avancuar.
on:
  pull_request:
    paths: ["hapi-6-state/**", "hapi-7-avancuar/**"]
  push:
    branches: [main]
    paths: ["hapi-6-state/**", "hapi-7-avancuar/**"]
  workflow_dispatch:
    inputs:
      mjedisi:
        description: "Mjedisi (dev ose prod). Bosh = përdor variablën TF_ENV, ose pa mjedis."
        type: choice
        options: ["", dev, prod]
        default: ""

permissions:
  id-token: write       # për OIDC (hyrje pa fjalëkalim)
  contents: read
  pull-requests: write  # për komentin me plan-in

env:
  # Terraform lexon automatikisht variablat ARM_* (azurerm) dhe TF_VAR_* (variablat tona)
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_emri: ${{ vars.TF_EMRI }}
  TF_IN_AUTOMATION: "true"
  ARM_RESOURCE_PROVIDER_REGISTRATIONS: "none"
  # Mjedisi: nga hyrja e ekzekutimit manual, ose nga variabla TF_ENV (dev/prod). Bosh = pa mjedis (sjellja e vjetër).
  TF_ENV: ${{ inputs.mjedisi || vars.TF_ENV }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ vars.TF_DIR || 'hapi-6-state' }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      # Kontroll sigurie i kodit (Checkov). soft_fail = tregon gjetjet por nuk e ndalon punën.
      - name: Checkov (siguria e kodit)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: ${{ vars.TF_DIR || 'hapi-6-state' }}
          framework: terraform
          soft_fail: true
          quiet: true

      - name: Init
        run: |
          # secili mjedis ka state të vetin (çelës tjetër në të njëjtin container)
          KEY="fakulteti.tfstate"
          if [ -n "$TF_ENV" ]; then KEY="fakulteti-$TF_ENV.tfstate"; fi
          terraform init \
            -backend-config="resource_group_name=${{ vars.STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.STATE_STORAGE }}" \
            -backend-config="subscription_id=${{ secrets.AZURE_SUBSCRIPTION_ID }}" \
            -backend-config="key=$KEY"

      - name: Validate
        run: terraform validate

      # Testet (terraform test) ekzistojnë vetëm te hapi-7-avancuar; punojnë pa Azure
      - name: Test
        run: |
          if [ -d tests ]; then terraform test; else echo "Nuk ka teste në këtë dosje"; fi

      - name: Plan
        id: plan
        run: |
          set -o pipefail
          VARFILE=""
          if [ -n "$TF_ENV" ]; then VARFILE="-var-file=envs/$TF_ENV.tfvars"; fi
          terraform plan -input=false -no-color $VARFILE -out=tfplan | tee plan.txt

      # Në pull request: plan-i shfaqet si koment, që të shihet para merge
      - name: Komento plan-in në PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '${{ vars.TF_DIR || 'hapi-6-state' }}';
            let plan = fs.existsSync(`${dir}/plan.txt`) ? fs.readFileSync(`${dir}/plan.txt`, 'utf8') : '(nuk u krijua plan)';
            if (plan.length > 60000) plan = plan.slice(-60000);
            const status = '${{ steps.plan.outcome }}' === 'success' ? 'u krijua' : 'DËSHTOI';
            const body = `### Terraform plan (${status})\n<details><summary>Shfaq plan-in</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number, body
            });

      - name: Apply (vetëm në main)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terraform apply -input=false -auto-approve tfplan
